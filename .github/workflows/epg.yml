name: epg
on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_epg.py
      - run: |
          git config user.name epg-bot
          git config user.email bot@users.noreply.github.com
          git add epg.xml epg.xml.gz coverage.txt
          git diff --cached --quiet || git commit -m "EPG $(date -u +%FT%TZ)"
          git push
